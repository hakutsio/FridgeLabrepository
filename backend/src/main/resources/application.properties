server.port=8080

# Nenhuma senha fica escrita aqui: todas vêm do arquivo .env (veja .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geladeira_lab}
spring.datasource.username=${DB_USER:fridge_app}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USER:postgres}
spring.flyway.password=${MIGRATION_PASSWORD}
spring.flyway.placeholders.appDbPassword=${DB_PASSWORD}
firmware.base-url=${FIRMWARE_URL:http://localhost:8081}

app.users.teacher-password=${TEACHER_PASSWORD}
app.users.student-password=${STUDENT_PASSWORD}

# Swagger desligado por padrão. Para ligar em desenvolvimento: SWAGGER_ENABLED=true (acesso só do professor).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
