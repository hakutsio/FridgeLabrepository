# As senhas vêm do arquivo .env (copie de .env.example). O Compose não sobe se alguma estiver faltando.
services:
  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_DB: geladeira_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geladeira_lab"]
      interval: 3s
      retries: 20
    volumes:
      - fridge_db:/var/lib/postgresql/data
  firmware:
    build: ./firmware
    expose: ["8081"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/geladeira_lab
      DB_USER: fridge_app
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      MIGRATION_USER: postgres
      MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?defina TEACHER_PASSWORD no arquivo .env}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:?defina STUDENT_PASSWORD no arquivo .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      FIRMWARE_URL: http://firmware:8081
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy
      firmware:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3002:80"
    depends_on: [backend]
volumes:
  fridge_db:
